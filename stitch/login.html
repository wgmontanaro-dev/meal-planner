<form action="#" class="space-y-lg" method="POST">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface" for="password">

                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-[48px] pr-sm py-sm text-body-md bg-surface border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-on-surface placeholder:text-on-surface-variant" id="password" name="password" placeholder="Enter shared password" required="" type="password"/>
</div>
</div>
<div>
<button class="w-full flex justify-center items-center py-sm px-md border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 active:scale-[0.98]" type="submit">
                        Access meal planner
                    </button>
</div>
</form>
